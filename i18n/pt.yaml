"home.intro.eyebrow": "SOBRE O GRUPO"
"home.intro.title_line1": "Diferentes perspectivas,"
"home.intro.title_line2": "uma mesma investigação."
"home.intro.paragraph1": "Somos um grupo de pesquisa em Física da Universidade Federal de Juiz de Fora dedicado ao estudo de questões relacionadas à teoria quântica, à informação e aos seus fundamentos."
"home.intro.paragraph2": "Reunimos diferentes perspectivas e ferramentas — da investigação conceitual e matemática à computação e às aplicações — para explorar novas maneiras de compreender e descrever sistemas físicos."
"home.intro.link": "Saiba mais sobre o grupo"

"home.research.eyebrow": "ÁREAS DE PESQUISA"
"home.research.title": "Frentes de pesquisa"
"home.research.description": "Conheça as principais áreas de investigação do grupo."
"home.research.tiq_description": "Investigação de problemas envolvendo informação, processos e sistemas quânticos, com diferentes abordagens teóricas, matemáticas e computacionais."
"home.research.applied_title": "Física Aplicada"
"home.research.applied_description": "Aplicação de métodos físicos, matemáticos e computacionais a problemas em diferentes contextos, incluindo simulação, computação e ensino de Física."
"home.research.foundations_title": "Fundamentos de Mecânica Quântica"
"home.research.foundations_description": "Estudo de questões conceituais e estruturais da teoria quântica, explorando diferentes formas de compreender, interpretar e descrever seus fenômenos."

