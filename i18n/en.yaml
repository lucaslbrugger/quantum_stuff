"home.intro.eyebrow": "ABOUT THE GROUP"
"home.intro.title_line1": "Different perspectives,"
"home.intro.title_line2": "one shared investigation."
"home.intro.paragraph1": "We are a research group in Physics at the Federal University of Juiz de Fora dedicated to studying questions related to quantum theory, information, and its foundations."
"home.intro.paragraph2": "We bring together different perspectives and tools — from conceptual and mathematical investigation to computation and applications — to explore new ways of understanding and describing physical systems."
"home.intro.link": "Learn more about the group"

"home.research.eyebrow": "RESEARCH AREAS"
"home.research.title": "Research fronts"
"home.research.description": "Explore the main research areas of the group."

"home.research.tiq_description": "Investigation of problems involving quantum information, processes, and systems through different theoretical, mathematical, and computational approaches."

"home.research.foundations_title": "Foundations of Quantum Mechanics"
"home.research.foundations_description": "Study of conceptual and structural questions in quantum theory, exploring different ways of understanding, interpreting, and describing its phenomena."

"home.research.applied_title": "Applied Physics"
"home.research.applied_description": "Application of physical, mathematical, and computational methods to problems in different contexts, including simulation, computation, and physics education."

